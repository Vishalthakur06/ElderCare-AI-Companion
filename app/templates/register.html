{% extends "base.html" %}
{% block title %}Create account · ElderCare{% endblock %}
{% block content %}

<div class="auth">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="logo-mark">♥</div>
      <h1 style="font-size:26px;margin-bottom:4px;">Create your account</h1>
      <p class="muted" style="font-size:14px;">Set up a private care space.</p>
    </div>

    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="mb-3">
        <label for="name">Full name</label>
        <input class="form-control" id="name" name="name" required placeholder="Your full name">
      </div>

      <div class="mb-3">
        <label for="email">Email address</label>
        <input class="form-control" id="email" type="email" name="email" required placeholder="you@example.com">
      </div>

      <div class="mb-3">
        <label for="password">Password <span class="muted" style="font-weight:400;">(at least 8 characters)</span></label>
        <input class="form-control" id="password" type="password" name="password" minlength="8" required placeholder="••••••••">
      </div>

      <div class="mb-4">
        <label for="role">Account type</label>
        <select class="form-select" id="role" name="role">
          <option value="elder">👴 Elder / User</option>
          <option value="caregiver">🧑‍⚕️ Caregiver</option>
        </select>
      </div>

      <button class="btn btn-primary btn-lg w-100">Create account →</button>
    </form>

    <p style="text-align:center;margin-top:20px;font-size:14px;color:var(--muted);">
      Already registered? <a href="{{ url_for('auth.login') }}" style="color:var(--teal);font-weight:600;">Sign in</a>
    </p>
  </div>
</div>

{% endblock %}
