{% extends "base.html" %}
{% block title %}Settings · ElderCare{% endblock %}
{% block content %}

<div class="page-title">
  <div style="width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;background:rgba(124,58,237,.12);">⚙️</div>
  <div>
    <h1 style="margin:0;">Settings & Privacy</h1>
    <p class="muted" style="margin:0;font-size:14px;">Manage your preferences and sharing consent.</p>
  </div>
</div>

<section class="cardx">
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <h2>🌐 Language</h2>
    <div class="mb-4">
      <label for="language">Preferred language</label>
      <select class="form-select" id="language" name="language" style="max-width:320px;">
        <option value="en" {{ 'selected' if current_user.language=='en' }}>🇬🇧 English</option>
        <option value="hi" {{ 'selected' if current_user.language=='hi' }}>🇮🇳 Hindi</option>
        <option value="mr" {{ 'selected' if current_user.language=='mr' }}>🇮🇳 Marathi</option>
      </select>
    </div>

    <h2>🔒 Caregiver Sharing Consent</h2>
    <p class="muted mb-3" style="font-size:14px;">Control what your linked caregiver can see. You can change this anytime.</p>

    <div style="display:flex;flex-direction:column;gap:16px;margin-bottom:28px;">
      <label style="display:flex;align-items:center;gap:14px;cursor:pointer;padding:16px;background:var(--surface2);border:1px solid var(--line);border-radius:var(--radius);font-weight:400;">
        <input type="checkbox" name="share_health" id="sh" {{ 'checked' if current_user.share_health }}
          style="width:20px;height:20px;accent-color:var(--teal);cursor:pointer;flex-shrink:0;">
        <div>
          <div style="font-weight:600;font-size:15px;">❤️ Share health records</div>
          <div class="muted" style="font-size:13px;">Allow your linked caregiver to view your health measurements.</div>
        </div>
      </label>

      <label style="display:flex;align-items:center;gap:14px;cursor:pointer;padding:16px;background:var(--surface2);border:1px solid var(--line);border-radius:var(--radius);font-weight:400;">
        <input type="checkbox" name="share_medicines" id="sm" {{ 'checked' if current_user.share_medicines }}
          style="width:20px;height:20px;accent-color:var(--teal);cursor:pointer;flex-shrink:0;">
        <div>
          <div style="font-weight:600;font-size:15px;">💊 Share medicine schedule</div>
          <div class="muted" style="font-size:13px;">Allow your linked caregiver to view your medicine list.</div>
        </div>
      </label>
    </div>

    <button class="btn btn-primary">💾 Save Settings</button>
  </form>
</section>

{% endblock %}
